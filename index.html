<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잔소리 투두리스트</title>
    <style>
        body {
            background-color: #b2c7d9;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 600px;
            background-color: #abc1de;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* 1. 대화상대 설정 화면 */
        #setup-screen {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            gap: 15px;
        }

        #setup-screen h2 {
            margin-bottom: 5px;
            color: #333;
            font-size: 22px;
        }

        #setup-screen input {
            width: 80%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            text-align: center;
            font-size: 16px;
        }

        #setup-screen button {
            width: 85%;
            background-color: #fee500;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* 2. 실제 채팅방 화면 (초기엔 숨김) */
        #chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            background-color: #9bbbd4;
            padding: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .profile-img {
            width: 40px;
            height: 40px;
            background-color: #ffeb3b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            max-width: 80%;
        }

        .message-row.mom {
            align-self: flex-start;
        }

        .message-row.my {
            align-self: flex-end;
            justify-content: flex-end;
        }

        .message {
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message.mom {
            background-color: #ffffff;
            border-top-left-radius: 2px;
        }

        .message.my {
            background-color: #fee500;
            border-top-right-radius: 2px;
        }

        .message-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 11px;
            color: #555;
            white-space: nowrap;
        }

        .read-badge {
            color: #d4a017;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .chat-input-area {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .chat-input-area button {
            background-color: #fee500;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- [화면 1] 대화상대 설정 화면 -->
        <div id="setup-screen">
            <h2>대화상대 설정</h2>
            <input type="text" id="partnerInput" placeholder="대화상대 이름 (예: 엄마)" value="엄마">
            <button onclick="startChat()">확인</button>
        </div>

        <!-- [화면 2] 실제 채팅방 화면 -->
        <div id="chat-screen">
            <div class="chat-header">
                <div class="profile-img">👩</div>
                <div id="partnerTitle">엄마</div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area">
                <input type="text" id="todoInput" placeholder="메세지 입력" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let todoList = [];
        let partnerName = "엄마";

        // ★ 타이머 설정 (깃허브 배포용: 10분 = 600000ms)
        // 로컬에서 빠르게 테스트하고 싶다면 이 값을 30000(30초)으로 바꿔서 테스트하세요!
        const NAG_INTERVAL = 10 * 60 * 1000; 

        document.addEventListener("DOMContentLoaded", () => {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        });

        function showSystemNotification(text) {
            if (Notification.permission === "granted") {
                new Notification(`${partnerName}의 메시지`, {
                    body: text,
                    icon: "https://cdn-icons-png.flaticon.com/512/4140/4140047.png"
                });
            }
        }

        function startChat() {
            const input = document.getElementById('partnerInput');
            if (input.value.trim() !== "") {
                partnerName = input.value.trim();
            }

            document.getElementById('partnerTitle').textContent = partnerName;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';

            sendMomMessage(`현우야, 딴거하지말고 오늘할거 빨리 보내놔라.`);

            // 10분마다 잔소리 타이머 실행
            setInterval(() => {
                if (todoList.length > 0) {
                    sendMomMessage(`현우야, 아직 ${todoList.join(', ')} 안 끝났잖아! 딴짓하지 말고 빨리 해라.`);
                }
            }, NAG_INTERVAL); 
        }

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? '오후' : '오전';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `${ampm} ${hours}:${minutes}`;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMomMessage(text) {
            const chatMessages = document.getElementById('chatMessages');
            
            const msgRow = document.createElement('div');
            msgRow.className = 'message-row mom';

            const momMsg = document.createElement('div');
            momMsg.className = 'message mom';
            momMsg.textContent = text;

            const timeSpan = document.createElement('div');
            timeSpan.className = 'message-info';
            timeSpan.textContent = getCurrentTime();

            msgRow.appendChild(momMsg);
            msgRow.appendChild(timeSpan);
            chatMessages.appendChild(msgRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            showSystemNotification(text);
        }

        function sendMessage() {
            const input = document.getElementById('todoInput');
            const chatMessages = document.getElementById('chatMessages');
            
            if (input.value.trim() === '') return;

            const text = input.value.trim();
            input.value = '';

            const msgRow = document.createElement('div');
            msgRow.className = 'message-row my';

            const infoDiv = document.createElement('div');
            infoDiv.className = 'message-info';

            const readBadge = document.createElement('span');
            readBadge.className = 'read-badge';
            readBadge.textContent = '1';

            const timeSpan = document.createElement('span');
            timeSpan.textContent = getCurrentTime();

            infoDiv.appendChild(readBadge);
            infoDiv.appendChild(timeSpan);

            const myMsg = document.createElement('div');
            myMsg.className = 'message my';
            myMsg.textContent = text;

            msgRow.appendChild(infoDiv);
            msgRow.appendChild(myMsg);
            chatMessages.appendChild(msgRow);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // 1초 뒤 '1' 사라짐
            setTimeout(() => {
                readBadge.remove();
            }, 1000);

            // 엄마의 응답 및 조건별 처리 로직
            setTimeout(() => {
                if (text.startsWith('/')) {
                    sendMomMessage("딴거 하지말고 빨리 해라.");
                } else if (text.endsWith('끝')) {
                    let targetTask = text.replace('끝', '').trim();
                    let index = todoList.indexOf(targetTask);

                    if (index !== -1) {
                        todoList.splice(index, 1);
                    }

                    if (todoList.length > 0) {
                        sendMomMessage(`오케이~ 나머지 ${todoList.join(', ')} 끝내놔`);
                    } else {
                        sendMomMessage("수고했어");
                    }
                } else {
                    todoList.push(text);
                    sendMomMessage(`그래, '${text}' 추가했다. 빨리 시작해라!`);
                }
            }, 800);
        }
    </script>

</body>
</html>
